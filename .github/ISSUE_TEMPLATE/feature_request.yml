name: Feature request
description: Something the action should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Two constraints shape what gets accepted: no runtime dependencies, and
        the action never checks out or executes pull request code.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. New inputs, changed behaviour, and so on.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Anything you tried or considered, including other actions.
