# .github/workflows/cla.yml in the repository you want to gate.

name: CLA

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Pull request events, and comments on pull requests. Whether a comment is
    # a signature is decided by the action, not here — one place, so the two
    # cannot disagree.
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: FraiseHQ/cla-gate-action@v1
        with:
          cla-url: https://github.com/FraiseHQ/fraise/blob/main/CLA.md
          signature-repo: FraiseHQ/cla-signatures
          signature-branch: main
          signature-token: ${{ secrets.CLA_SIGNATURES_TOKEN }}
